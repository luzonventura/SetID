[project]
name = "setid"
version = "0.1.0"
description = "Extractor de tracklists de sets de DJ"
authors = [
    { name = "luzonventura", email = "antonioluzonventura@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pywebview>=6.2.1",
    "sqlmodel>=0.0.48",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
setid = "setid.cli:main"
setid-app = "setid.app.desktop:main"

[project.optional-dependencies]
shazam = [
    "shazamio>=0.8.1",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/setid/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "BLE", "PTH", "ASYNC"]
ignore = [
    "S603",   # subprocess sin shell: es justo lo que queremos (ver setid.proc)
    "RUF001", # caracteres ambiguos en textos en español (–, ×)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "ASYNC240"]
# Contiene un bloque de C# para PowerShell (accesos directos con AppUserModelID).
"scripts/build_app.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["setid"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["shazamio", "shazamio.*", "shazamio_core", "shazamio_core.*", "yt_dlp", "yt_dlp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Migraciones autogeneradas por Alembic
module = ["setid.db.migrations.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["ffmpeg: necesita ffmpeg/ffprobe instalados"]
