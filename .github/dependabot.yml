# Actualizaciones semanales agrupadas. yt-dlp necesita estar al día para seguir funcionando
# con YouTube y SoundCloud, así que va en su propio grupo.

version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      yt-dlp:
        patterns: ["yt-dlp"]
      python:
        patterns: ["*"]
        exclude-patterns: ["yt-dlp"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Los tipos de Node siguen a la versión que usa el proyecto (Node 22).
      - dependency-name: "@types/node"
        versions: [">=23"]
      # eslint-plugin-jsx-a11y todavía no admite ESLint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # typescript-eslint todavía no admite TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
